<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <!-- <link rel="stylesheet" href="styles.css"> -->
  <style>
    body {
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  background-color: #f4f4f4;
}

.login-container {
  width: 300px;
  padding: 20px;
  background-color: #fff;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
  text-align: center;
  border-radius: 8px;
}

.login-container h2 {
  margin-bottom: 20px;
}

.login-container input {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  border: 1px solid #ccc;
  border-radius: 4px;
}

.login-container button {
  width: 100%;
  padding: 10px;
  background-color: #28a745;
  border: none;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  border-radius: 4px;
}

.login-container button:hover {
  background-color: #218838;
}

#message {
  color: red;
  margin-top: 15px;
}

  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Usuário" required>
      <input type="password" id="password" placeholder="Senha" required>
      <button type="submit">Entrar</button>
    </form>
    <p id="message"></p>
  </div>
  <script>
    // Função para enviar requisição à API REST do SharePoint
async function login(event) {
  event.preventDefault(); // Previne o envio do formulário

  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  try {
    const response = await fetch("https://grupoccr.sharepoint.com/sites/PCAtendimento/_api/web/lists/getbytitle('Colaboradores')/items", {
      method: "GET",
      headers: {
        "Accept": "application/json;odata=verbose",
        "Authorization": "Bearer SEU_TOKEN_DE_AUTENTICACAO"
      }
    });

    if (!response.ok) throw new Error("Erro ao conectar com o SharePoint");

    const data = await response.json();
    const users = data.d.results;

    // Procura um usuário que combine com os dados inseridos
    const user = users.find(user => user.Username === username && user.Password === password);

    if (user) {
      message.textContent = "Login bem-sucedido!";
      message.style.color = "green";
      // Redireciona para outra página, se necessário
      window.location.href = "/home";
    } else {
      message.textContent = "Usuário ou senha incorretos.";
      message.style.color = "red";
    }

  } catch (error) {
    console.error("Erro ao fazer login:", error);
    message.textContent = "Erro ao conectar com o servidor.";
    message.style.color = "red";
  }
}

document.getElementById("loginForm").addEventListener("submit", login);


const siteUrl = "https://grupoccr.sharepoint.com/sites/PCAtendimento";
const listTitle = "Colaboradores";
const requestUrl = `${siteUrl}/_api/web/lists/getbytitle('${listTitle}')/items`;

fetch(requestUrl, {
    method: 'GET',
    headers: {
        'Accept': 'application/json;odata=verbose', // Define o formato dos dados retornados
        //'Authorization': 'Bearer SEU_TOKEN_DE_ACESSO' // Token de acesso
    }
})
.then(response => response.json()) // Converte o resultado em JSON
.then(data => {
    console.log(data.d.results); // Acessa os itens da lista no JSON
})
.catch(error => console.error('Erro ao obter os itens:', error));


  </script>
</body>
</html>
